<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio CMS</title>
  <link rel="icon" href="/site/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/fontsource/instrument-sans/400.css">
  <link rel="stylesheet" href="/fontsource/instrument-sans/500.css">
  <link rel="stylesheet" href="/fontsource/instrument-sans/600.css">
  <link rel="stylesheet" href="/fontsource/jetbrains-mono/400.css">
  <!-- Font pairings shown on the Appearance page. Only downloaded when that page uses them. -->
  <link rel="stylesheet" href="/fontsource/newsreader/600.css">
  <link rel="stylesheet" href="/fontsource/nunito/600.css">
  <link rel="stylesheet" href="/fontsource/space-grotesk/600.css">
  <link rel="stylesheet" href="/fontsource/ibm-plex-mono/400.css">
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js"></script>
  <script defer src="/vendor/alpine.js"></script>
</head>
<body x-data="cms">

<template x-if="fatal">
  <div class="pvdead" style="height:100vh;padding:0 64px"><b x-text="fatal"></b><span>Start it again from the desktop shortcut, or run <code style="color:inherit">npm run cms</code> in the portfolio folder.</span></div>
</template>

<div class="app" :class="{ solo: view === 'setup' }" x-show="ready && !fatal" x-cloak>
  <!-- title bar -->
  <header class="tb">
    <b>Portfolio CMS</b>
    <span class="site" x-text="view === 'setup' ? 'first launch' : (data.settings?.siteUrl || '').replace(/^https?:\/\//, '')"></span>
    <div class="stw" x-show="view !== 'setup'" @click.outside="siteMenu = false">
      <button class="chip" type="button" :class="siteStatus.tone" @click="siteMenu = !siteMenu" :aria-expanded="String(siteMenu)" aria-haspopup="menu"><span class="d"></span><span x-text="siteStatus.text"></span><span class="warnmark" x-show="renewal" title="Your domain expires soon">!</span><span aria-hidden="true">▾</span></button>
      <div class="menu" role="menu" x-show="siteMenu" x-transition.opacity x-cloak>
        <div class="mst"><b x-text="siteStatus.title"></b><span x-text="siteStatus.detail"></span>
          <template x-for="n in siteStatus.notes || []" :key="n"><span x-text="n"></span></template>
          <span class="bad" x-show="renewal" x-text="renewal ? `${renewal.text}. Renew it where you bought it.` : ''"></span>
        </div>
        <template x-if="liveUrl"><a role="menuitem" :href="liveUrl" target="_blank" rel="noopener">View site <small>↗</small></a></template>
        <template x-if="siteStatus.hosting"><button role="menuitem" type="button" @click="siteMenu = false; go('#hosting')">Open Hosting</button></template>
        <template x-if="!data.status?.maintenance"><button role="menuitem" type="button" @click="openMaint('maint-on')">Turn on maintenance… <small>asks first</small></button></template>
        <template x-if="data.status?.maintenance"><button role="menuitem" type="button" @click="openMaint('maint-off')">Turn off maintenance…</button></template>
        <button role="menuitem" type="button" @click="openMaint('maint-edit')">Edit maintenance message</button>
      </div>
    </div>
    <button class="quit" type="button" @click="quit()" style="margin-left:auto">Quit</button>
  </header>

  <!-- sidebar -->
  <nav class="side" x-show="view !== 'setup'" aria-label="Sections">
    <a href="#profile" :class="{ on: navOn('profile') }">Profile <span class="dot" x-show="sectionDirty('profile')"></span></a>
    <a href="#projects" :class="{ on: navOn('projects') }">Projects <span class="dot" x-show="sectionDirty('projects')"></span></a>
    <a href="#experience" :class="{ on: navOn('experience') }">Experience <span class="dot" x-show="sectionDirty('experience')"></span></a>
    <a href="#toolkit" :class="{ on: navOn('toolkit') }">Toolkit <span class="dot" x-show="sectionDirty('toolkit')"></span></a>
    <a href="#sections" :class="{ on: navOn('sections') }">Sections <span class="dot" x-show="sectionDirty('sections')"></span></a>
    <span class="gl">Look</span>
    <a href="#appearance" :class="{ on: navOn('appearance') }">Appearance <span class="dot" x-show="sectionDirty('theme')"></span></a>
    <div class="sep">
      <span class="gl">Site</span>
      <a href="#history" :class="{ on: navOn('history') }">History</a>
      <a href="#hosting" :class="{ on: navOn('hosting') }">Hosting</a>
      <a href="#settings" :class="{ on: navOn('settings') }">Settings <span class="dot" x-show="sectionDirty('settings')"></span></a>
    </div>
  </nav>

  <main class="main" :style="view === 'setup' ? 'padding:0' : ''">

    <!-- ================= PROJECTS / EXPERIENCE LISTS ================= -->
    <template x-if="view === 'projects' || view === 'experience'">
      <div>
        <div class="ph">
          <h1 x-text="view === 'projects' ? 'Projects' : 'Experience'"></h1>
          <span class="sub" x-text="`${data[view].length} ${view === 'projects' ? (data[view].length === 1 ? 'project' : 'projects') : (data[view].length === 1 ? 'item' : 'items')} · ${data[view].filter((p) => p.show).length} on site`"></span>
          <div class="r"><button class="btn" type="button" @click="go(`#${view}/new`)" x-text="view === 'projects' ? '+ Add project' : '+ Add experience'"></button></div>
        </div>
        <template x-if="!data[view].length">
          <div class="empty"><b x-text="view === 'projects' ? 'Add your first project' : 'Add your first experience'"></b><span x-text="view === 'projects' ? 'Projects appear in the Work list on your site.' : 'Study, jobs, roles and volunteering appear under Experience.'"></span></div>
        </template>
        <div x-show="data[view].length">
          <div class="lh" :class="{ exp: view === 'experience' }">
            <span></span>
            <span x-text="view === 'projects' ? 'Image' : 'Dates'"></span>
            <span>Title</span>
            <span x-text="view === 'projects' ? 'Year' : 'Write-up'"></span>
            <span>On site</span><span></span>
          </div>
          <template x-for="(p, i) in data[view]" :key="p.slug">
            <div class="lr" :class="{ exp: view === 'experience', off: !p.show, dragging: drag && drag.list === view && drag.i === i, over: dropOn === `${view}:${i}` }"
                 draggable="true" @dragstart="dragStart(view, i, $event)" @dragover="dragOver(view, i, $event)" @drop.prevent="dropAt(view, i)" @dragend="dragEnd()"
                 @click="go(`#${view}/${p.slug}`)" @keydown.enter="go(`#${view}/${p.slug}`)" tabindex="0">
              <span class="hd" title="Drag to reorder" aria-hidden="true">⠿</span>
              <template x-if="view === 'projects'">
                <span><template x-if="p.image"><img class="th" :src="`/site${p.image}`" alt=""></template><template x-if="!p.image"><span class="th none">No image</span></template></span>
              </template>
              <template x-if="view === 'experience'"><span class="yr" style="font-size:12px" x-text="fmtRange(p.start, p.end)"></span></template>
              <span style="min-width:0"><b x-text="p.title"></b><span class="s" x-text="view === 'projects' ? p.summary : p.org"></span></span>
              <template x-if="view === 'projects'"><span class="yr" x-text="p.year"></span></template>
              <template x-if="view === 'experience'"><span class="wu" :class="{ no: !p.writeup }" x-text="p.writeup ? 'On' : 'Off'"></span></template>
              <button class="sw" type="button" role="switch" :aria-checked="String(p.show)" :aria-label="`${p.title} on site`" @click.stop="toggleShow(view, p)"></button>
              <span class="st" x-text="itemEdited(view, p.slug) ? 'Not live yet' : ''"></span>
            </div>
          </template>
          <p class="hint">Drag ⠿ to change the order on your site. Click a row to edit it.</p>
        </div>
      </div>
    </template>

    <!-- ================= PROJECT / EXPERIENCE EDITOR ================= -->
    <template x-if="(view === 'project' || view === 'exp') && form">
      <div>
        <div class="ph">
          <span class="crumb"><a :href="view === 'project' ? '#projects' : '#experience'" x-text="view === 'project' ? 'Projects' : 'Experience'"></a> /<b x-text="form.title || (view === 'project' ? 'New project' : 'New experience')"></b></span>
          <div class="r">
            <span class="onsite"><button class="sw" type="button" role="switch" :aria-checked="String(form.show)" @click="form.show = !form.show" aria-labelledby="ed-on"></button><span id="ed-on">On site</span></span>
            <span class="svst" :class="saveState" x-text="saveText"></span>
            <button class="linkbtn" type="button" x-show="canUndo" @click="undoPage()" title="Go back to how this page was when you opened it">Undo</button>
          </div>
        </div>
        <div class="tabs" role="tablist">
          <button type="button" role="tab" :class="{ on: tab === 'details' }" @click="go(hashFor({ view, slug, isNew, tab: 'details' }))">Details</button>
          <button type="button" role="tab" :class="{ on: tab === 'writeup' }" @click="go(hashFor({ view, slug, isNew, tab: 'writeup' }))">Write-up <span class="badge" x-text="form.writeup ? 'On' : 'Off'"></span></button>
        </div>
        <div class="bn" x-show="errorCount" x-text="`${errorCount} field${errorCount === 1 ? ' needs' : 's need'} fixing before this can be saved.`"></div>

        <!-- project details -->
        <template x-if="tab === 'details' && view === 'project'">
          <div class="fg">
            <div class="f t" :class="{ err: err('title') }"><label for="p-title">Title</label><input id="p-title" type="text" x-model="form.title" maxlength="60"><span class="errt" x-text="err('title')"></span></div>
            <div class="f q" :class="{ err: err('year') }"><label for="p-year">Year</label><input id="p-year" type="number" x-model.number="form.year"><span class="errt" x-text="err('year')"></span></div>
            <div class="f" :class="{ err: err('summary') }">
              <label for="p-summary">Summary <i :class="{ over: count(form.summary, 180).over }" x-text="count(form.summary, 180).text"></i></label>
              <textarea id="p-summary" x-model="form.summary" rows="3" placeholder="What it is, and what you did on it."></textarea>
              <span class="errt" x-text="err('summary')"></span>
            </div>
            <div class="f" :class="{ err: err('stack') }"><label for="p-stack">Stack</label><input id="p-stack" type="text" x-model="form.stack" placeholder="React, Express, PostgreSQL"><span class="help">Separate with commas.</span></div>
            <div class="f h" :class="{ err: err('live') }"><label for="p-live">Live link <i class="opt">Optional</i></label><input id="p-live" type="url" class="mono" x-model="form.live" placeholder="https://"><span class="errt" x-text="err('live')"></span></div>
            <div class="f h" :class="{ err: err('code') }"><label for="p-code">Code <i class="opt">Optional</i></label><input id="p-code" type="url" class="mono" x-model="form.code" placeholder="https://github.com/…"><span class="errt" x-text="err('code')"></span></div>
            <div class="f">
              <span class="lb">Screenshot <i class="opt">Optional</i></span>
              <template x-if="form.image">
                <div class="media">
                  <img class="shot" :src="`/site${form.image}`" alt="">
                  <div class="meta">
                    <span class="fn" x-text="fileName(form.image)"></span>
                    <span x-show="imageInfo" x-text="imageInfo ? `${imageInfo.width} × ${imageInfo.height} · ${fmtSize(imageInfo.size)}` : ''"></span>
                    <div class="acts"><label class="btn sm" for="p-img">Replace</label><button class="btn sm ghost" type="button" @click="form.image = null; imageInfo = null">Remove</button></div>
                  </div>
                </div>
              </template>
              <template x-if="!form.image">
                <label class="drop" for="p-img" @dragover.prevent="$el.classList.add('on')" @dragleave="$el.classList.remove('on')" @drop.prevent="$el.classList.remove('on'); uploadProjectImage($event.dataTransfer.files[0])">Drop an image here, or click to choose one</label>
              </template>
              <input class="hidden-file" id="p-img" type="file" accept="image/*" @change="uploadProjectImage($event.target.files[0]); $event.target.value = ''">
              <span class="help">Resized for the web automatically.</span>
            </div>
            <div class="f danger-zone" x-show="!isNew"><button class="btn sm ghost danger" type="button" @click="removeEntry()" style="justify-self:start">Delete project</button></div>
          </div>
        </template>

        <!-- experience details -->
        <template x-if="tab === 'details' && view === 'exp'">
          <div class="fg">
            <div class="f h" :class="{ err: err('title') }"><label for="e-title">Title</label><input id="e-title" type="text" x-model="form.title" placeholder="Software engineering intern"><span class="errt" x-text="err('title')"></span></div>
            <div class="f h" :class="{ err: err('org') }"><label for="e-org">Organisation</label><input id="e-org" type="text" x-model="form.org" placeholder="Company, university or event"><span class="errt" x-text="err('org')"></span></div>
            <div class="f h" :class="{ err: err('start') }"><label for="e-start">Start</label><input id="e-start" type="month" x-model="form.start"><span class="errt" x-text="err('start')"></span></div>
            <div class="f h" :class="{ err: err('end') }"><label for="e-end">End</label><input id="e-end" type="month" :value="form.end || ''" @input="form.end = $event.target.value || null" :disabled="form.end === null"><span class="errt" x-text="err('end')"></span></div>
            <div class="f"><label class="chk"><input type="checkbox" :checked="form.end === null" @change="form.end = $event.target.checked ? null : form.start">I still work or study here</label></div>
            <div class="f" :class="{ err: err('description') }">
              <label for="e-desc">Description <i :class="{ over: count(form.description, 180).over }" x-text="count(form.description, 180).text"></i></label>
              <textarea id="e-desc" x-model="form.description" rows="3" placeholder="What you did and what came of it."></textarea>
              <span class="errt" x-text="err('description')"></span>
            </div>
            <div class="f" :class="{ err: err('link') }"><label for="e-link">Link <i class="opt">Optional</i></label><input id="e-link" type="url" class="mono" x-model="form.link" placeholder="https://"><span class="errt" x-text="err('link')"></span></div>
            <div class="f danger-zone" x-show="!isNew"><button class="btn sm ghost danger" type="button" @click="removeEntry()" style="justify-self:start">Delete experience</button></div>
          </div>
        </template>

        <!-- write-up (shared) -->
        <template x-if="tab === 'writeup'">
          <div>
            <div class="tg" style="margin-bottom:14px;font-size:13px">
              <button class="sw" type="button" role="switch" :aria-checked="String(form.writeup)" @click="form.writeup = !form.writeup" aria-labelledby="wu-on-l"></button>
              <span id="wu-on-l" x-text="form.writeup ? 'Write-up page is on. It gets a Write-up link on your site.' : 'Write-up page is off. Your text is kept.'"></span>
            </div>
            <div class="mdbar" role="toolbar" aria-label="Formatting">
              <button type="button" @click="mdLine('## ')" title="Heading">H2</button>
              <button type="button" @click="mdLine('### ')" title="Subheading">H3</button>
              <span class="gap"></span>
              <button type="button" @click="md('**', '**', 'bold text')" title="Bold"><b>B</b></button>
              <button type="button" @click="md('_', '_', 'italic text')" title="Italic"><i>I</i></button>
              <button type="button" @click="md('[', '](https://)', 'link text')" title="Link">link</button>
              <button type="button" @click="md('`', '`', 'code')" title="Inline code">`code`</button>
              <span class="gap"></span>
              <label for="md-img" style="font-family:var(--mono);font-size:12.5px;padding:3px 8px;border-radius:4px;cursor:pointer" title="Insert image">image</label>
              <button type="button" @click="mdLine('- ')" title="Bulleted list">list</button>
              <button type="button" @click="mdLine('> ')" title="Quote">quote</button>
              <span class="r" x-text="`${words} words · ${Math.max(1, Math.round(words / 220))} min read`"></span>
            </div>
            <input class="hidden-file" id="md-img" type="file" accept="image/*" @change="mdImage($event.target.files[0]); $event.target.value = ''">
            <textarea class="md" x-ref="md" x-model="writeup" spellcheck="true" aria-label="Write-up in Markdown"
              placeholder="## The problem&#10;What were you trying to fix?&#10;&#10;## What I built&#10;- The main parts, and what you did on each&#10;&#10;## What I learned&#10;Paste or drop images straight in."
              @paste="onMdPaste($event)" @dragover.prevent="$el.classList.add('drag')" @dragleave="$el.classList.remove('drag')" @drop.prevent="$el.classList.remove('drag'); onMdDrop($event)"></textarea>
            <p class="hint">Markdown. Paste or drop images to add them. The preview shows the page as you write.</p>
          </div>
        </template>
      </div>
    </template>

    <!-- ================= PROFILE ================= -->
    <template x-if="view === 'profile' && form">
      <div>
        <div class="ph"><h1>Profile</h1><span class="sub">Who you are, shown in your site's sidebar.</span><div class="r"><span class="svst" :class="saveState" x-text="saveText"></span><button class="linkbtn" type="button" x-show="canUndo" @click="undoPage()" title="Go back to how this page was when you opened it">Undo</button></div></div>
        <div class="bn" x-show="errorCount" x-text="`${errorCount} field${errorCount === 1 ? ' needs' : 's need'} fixing before this can be saved.`"></div>
        <div class="fg">
          <div class="f">
            <span class="lb">Photo</span>
            <div class="focal">
              <template x-if="form.photo.src">
                <div class="big" @mousedown="setFocal($event)" @mousemove="focalDrag($event)" title="Click or drag to set the focus">
                  <img :src="`/site${form.photo.src}`" alt="">
                  <span class="pt" :style="`left:${form.photo.focusX}%;top:${form.photo.focusY}%`"></span>
                </div>
              </template>
              <template x-if="!form.photo.src">
                <label class="big drop" for="ph-file" style="display:grid;place-items:center;cursor:pointer">Choose a photo</label>
              </template>
              <div class="crops">
                <div><template x-if="form.photo.src"><img class="crop" :src="`/site${form.photo.src}`" alt="" :style="`width:112px;height:112px;border-radius:10px;object-position:${form.photo.focusX}% ${form.photo.focusY}%`"></template><template x-if="!form.photo.src"><span class="crop" style="width:112px;height:112px;border-radius:10px" x-text="initials(form.name)"></span></template>Desktop</div>
                <div><template x-if="form.photo.src"><img class="crop" :src="`/site${form.photo.src}`" alt="" :style="`width:72px;height:72px;border-radius:8px;object-position:${form.photo.focusX}% ${form.photo.focusY}%`"></template><template x-if="!form.photo.src"><span class="crop" style="width:72px;height:72px;border-radius:8px" x-text="initials(form.name)"></span></template>Phone</div>
                <div><label class="btn sm" for="ph-file" x-text="form.photo.src ? 'Change photo' : 'Choose photo'"></label><button class="btn sm ghost" type="button" x-show="form.photo.src" @click="form.photo.src = null">Remove</button></div>
              </div>
            </div>
            <input class="hidden-file" id="ph-file" type="file" accept="image/*" @change="uploadPhoto($event.target.files[0]); $event.target.value = ''">
            <span class="help" x-show="form.photo.src">Click or drag on the photo to set where both crops centre.</span>
          </div>
          <div class="f h" :class="{ err: err('name') }"><label for="pr-name">Name</label><input id="pr-name" type="text" x-model="form.name"><span class="errt" x-text="err('name')"></span></div>
          <div class="f h" :class="{ err: err('role') }"><label for="pr-role">Role</label><input id="pr-role" type="text" x-model="form.role"><span class="errt" x-text="err('role')"></span></div>
          <div class="f" :class="{ err: err('bio') }"><label for="pr-bio">Bio <i :class="{ over: count(form.bio, 400).over }" x-text="count(form.bio, 400).text"></i></label><textarea id="pr-bio" x-model="form.bio" rows="5"></textarea><span class="errt" x-text="err('bio')"></span></div>
          <div class="f" :class="{ err: err('headline') }"><label for="pr-head">Headline <i class="opt">Optional</i><i :class="{ over: count(form.headline || '', 120).over }" x-text="count(form.headline || '', 120).text"></i></label><input id="pr-head" type="text" x-model="form.headline" placeholder="I build tools that make student life a little less painful."><span class="help">Shown big above your work.</span><span class="errt" x-text="err('headline')"></span></div>

          <div class="grp">Details <span class="gh">On site</span></div>
          <div class="f">
            <template x-for="row in DETAIL_ROWS" :key="row[0]">
              <div class="dr" :class="{ err: err(`details.${row[0]}.value`) }">
                <label :for="`d-${row[0]}`" x-text="row[1]"></label>
                <input :id="`d-${row[0]}`" type="text" x-model="form.details[row[0]].value" :placeholder="row[2]">
                <button class="sw" type="button" role="switch" :aria-checked="String(form.details[row[0]].show)" :aria-label="`${row[1]} on site`" @click="form.details[row[0]].show = !form.details[row[0]].show"></button>
              </div>
            </template>
            <span class="help">Shown in one line under your role. Empty ones are skipped.</span>
          </div>

          <div class="grp">Availability</div>
          <div class="f"><div class="tg"><button class="sw" type="button" role="switch" :aria-checked="String(form.availability.show)" @click="form.availability.show = !form.availability.show" aria-label="Availability on site"></button><input type="text" x-model="form.availability.text" placeholder="Looking for a software engineering internship from June 2027" style="flex:1" aria-label="Availability text"></div></div>

          <div class="grp">Links <span class="gh">On site</span></div>
          <div class="f">
            <template x-for="(l, i) in form.links" :key="i">
              <div class="lk" :class="{ over: dropOn === `links:${i}` }" @dragover="dragOver('links', i, $event)" @drop.prevent="dropAt('links', i)">
                <span class="hd" draggable="true" @dragstart="dragStart('links', i, $event)" @dragend="dragEnd()" title="Drag to reorder">⠿</span>
                <input type="text" x-model="l.label" placeholder="GitHub" :class="{ err: err(`links.${i}.label`) }" aria-label="Link label">
                <input type="url" class="mono" x-model="l.url" placeholder="https://" :class="{ err: err(`links.${i}.url`) }" aria-label="Link address">
                <button class="x" type="button" @click="form.links.splice(i, 1)" :aria-label="`Remove ${l.label || 'link'}`">×</button>
                <button class="sw" type="button" role="switch" :aria-checked="String(l.show)" @click="l.show = !l.show" :aria-label="`${l.label || 'Link'} on site`"></button>
              </div>
            </template>
            <template x-for="(l, i) in form.links" :key="'e' + i"><span class="errt" x-show="err(`links.${i}.url`) || err(`links.${i}.label`)" x-text="`${l.label || 'Link'}: ${err(`links.${i}.label`) || err(`links.${i}.url`)}`"></span></template>
            <button class="btn sm ghost" type="button" style="justify-self:start" @click="form.links.push({ label: '', url: '', show: true })">+ Add link</button>
          </div>

          <div class="grp">Email <span class="gh"><button class="sw" type="button" role="switch" :aria-checked="String(form.email.show)" @click="form.email.show = !form.email.show" aria-label="Email on site"></button></span></div>
          <div class="f"><input type="email" class="mono" x-model="form.email.value" placeholder="hello@example.com" aria-label="Email"></div>

              <div class="meta">
                <span class="fn" style="font-family:var(--sans)" x-text="form.settings.shareImage === 'generated' ? 'Made for you' : 'Your own image'"></span>
                <span x-text="form.settings.shareImage === 'generated' ? 'From your name, role and colours. Updates by itself.' : '1200 × 630'"></span>
                <div class="acts">
                  <label class="btn sm" for="og-file">Use my own image</label>
                  <button class="btn sm ghost" type="button" x-show="form.settings.shareImage === 'custom'" @click="form.settings.shareImage = 'generated'">Use the made one</button>
                </div>
              </div>
            </div>
            <input class="hidden-file" id="og-file" type="file" accept="image/*" @change="uploadShare($event.target.files[0]); $event.target.value = ''">
          </div>
          <div class="f" :class="{ err: err('settings.siteUrl') }"><label for="s-url">Site address</label><input id="s-url" type="url" class="mono" x-model="form.settings.siteUrl" placeholder="https://"><span class="help">Hosting fills this in when your site goes online.</span><span class="errt" x-text="err('settings.siteUrl')"></span></div>

          <template x-if="expiry && expiry.reason !== 'no-domain'">
            <div class="f" style="grid-column:span 6">
              <span class="lb">Domain renewal</span>
              <template x-if="expiry?.ok">
                <div class="row2"><span x-text="`${expiry.domain} expires on ${fmtDay(expiry.expires)}`"></span><button class="btn sm" type="button" @click="loadExpiry(true)">Check again</button></div>
              </template>
              <span class="help" x-show="expiry?.ok">Read from the domain registry. You're reminded 30 days before.</span>
              <template x-if="!expiry?.ok">
                <div class="row2"><input id="s-renew" type="date" x-model="form.settings.domainRenews" style="max-width:200px" aria-label="Domain renews on"><button class="btn sm" type="button" @click="loadExpiry(true)">Look it up</button></div>
              </template>
              <span class="help" x-show="!expiry?.ok">Couldn't look it up. Enter the date from where you bought it.</span>
              <span class="errt" x-text="err('settings.domainRenews')"></span>
            </div>
          </template>

          <div class="grp">GitHub backup</div>
          <div class="f">
            <span class="okline" x-show="data.remote" x-text="`✓ Every publish is backed up to ${data.remote.replace(/^https?:\/\//, '').replace(/\.git$/, '')}`"></span>
            <span class="badline" x-show="!data.remote">No GitHub backup yet. Publishing saves versions on this computer only.</span>
            <button class="btn sm" type="button" style="justify-self:start" @click="go('#setup')" x-text="data.remote ? 'Change' : 'Set up GitHub backup'"></button>
          </div>

          <details class="adv">
            <summary>Advanced <span>Folder, branch, preview port</span></summary>
            <div class="fg" style="margin-top:14px">
              <div class="f"><span class="lb">Folder</span><input type="text" class="mono" :value="data.root" readonly aria-label="Folder"></div>
              <div class="f h"><span class="lb">Branch</span><input type="text" class="mono" :value="data.branch" readonly aria-label="Branch"></div>
              <div class="f h"><label for="s-port">Preview port</label><input id="s-port" type="number" class="mono" x-model.number="portInput" @change="applyPort()"><span class="help">Restarts the preview when changed.</span></div>
            </div>
          </details>
        </div>
      </div>
    </template>

    <!-- ================= HOSTING ================= -->
    <template x-if="view === 'hosting'">
      <div class="narrow">
        <div class="ph"><h1>Hosting</h1><span class="sub">Put your site online, free, with Cloudflare Pages.</span></div>

        <div class="note bad" x-show="hostingForm.error"><span x-text="hostingForm.error"></span></div>
        <template x-if="hosting && hosting.projectMissing">
          <div class="note warn"><span x-text="`The site “${hosting.projectMissing}” was deleted in Cloudflare. Create it again below to keep publishing.`"></span></div>
        </template>
        <template x-if="domainState === 'live' && changes.items.some((i) => i.key === 'settings')">
          <div class="note"><span x-text="`Publish once so links and share previews use https://${hosting.domain}.`"></span><button class="btn sm pri" type="button" @click="publish('')" :disabled="!!busy">Publish</button></div>
        </template>

        <div class="pvdead" style="height:auto;padding:24px 0" x-show="!hosting"><b>Checking Cloudflare…</b></div>

        <template x-if="hosting">
          <ol class="steps">
            <!-- 1. account -->
            <li class="step" :class="hosting.connected ? 'done' : 'now'">
              <span class="n" aria-hidden="true" x-text="hosting.connected ? '✓' : '1'"></span>
              <div class="body">
                <h2>Cloudflare account</h2>
                <template x-if="hosting.connected">
                  <div class="row"><p x-text="`Signed in as ${hosting.email}`"></p><button class="btn sm" type="button" @click="confirmBar('Disconnect Cloudflare?', 'Your site stays online. Publishing won’t upload until you connect again.', 'Disconnect', () => hostingAction('logout'))" :disabled="!!hostingForm.busy">Disconnect</button></div>
                </template>
                <template x-if="!hosting.connected && hosting.loginPending">
                  <div>
                    <p>A Cloudflare page opened in your browser. Sign in or create a free account, then click <b>Allow</b>.</p>
                    <div class="row"><span class="wait">Waiting for you in the browser</span><button class="btn sm" type="button" @click="hostingAction('cancel')">Cancel</button></div>
                  </div>
                </template>
                <template x-if="!hosting.connected && !hosting.loginPending">
                  <div>
                    <p x-text="hosting.offline ? 'Cloudflare can’t be reached right now. Check your internet connection.' : 'Opens Cloudflare in your browser to sign in or create a free account. The CMS only asks to manage Pages sites and read your domains.'"></p>
                    <p class="badline" x-show="hosting.loginError" x-text="hosting.loginError"></p>
                    <div class="row"><button class="btn sm pri" type="button" @click="hostingAction('login')" :disabled="!!hostingForm.busy">Connect Cloudflare</button></div>
                  </div>
                </template>
              </div>
            </li>

            <!-- 2. site -->
            <li class="step" :class="hosting.project ? 'done' : (hosting.connected ? 'now' : 'later')">
              <span class="n" aria-hidden="true" x-text="hosting.project ? '✓' : '2'"></span>
              <div class="body">
                <h2>Site</h2>
                <template x-if="hosting.project">
                  <div>
                    <p><a :href="`https://${hosting.subdomain}`" target="_blank" rel="noopener" x-text="`${hosting.subdomain} ↗`"></a></p>
                    <div class="row">
                      <p class="muted" x-text="hosting.lastDeployAt ? `Last uploaded ${fmtDate(hosting.lastDeployAt)}` : 'Nothing uploaded yet'"></p>
                      <button class="btn sm" type="button" @click="hostingAction('deploy')" :disabled="!!hostingForm.busy || !!busy || !changes.hasHead" x-text="hostingForm.busy === 'deploy' ? 'Uploading…' : 'Upload now'"></button>
                    </div>
                  </div>
                </template>
                <template x-if="!hosting.project">
                  <div>
                    <p>Creates your site with a free address. You can add a domain later.</p>
                    <div class="row">
                      <span class="addr"><input type="text" class="mono" x-model="hostingForm.project" aria-label="Site name" :disabled="!hosting.connected" @keydown.enter="hostingAction('project')"><span>.pages.dev</span></span>
                      <button class="btn sm" type="button" @click="hostingAction('project')" :disabled="!hosting.connected || !!hostingForm.busy || !hostingForm.project.trim()" x-text="hostingForm.busy === 'project' ? 'Creating…' : 'Create site'"></button>
                    </div>
                  </div>
                </template>
              </div>
            </li>

            <!-- 3. domain -->
            <li class="step" :class="domainState === 'live' ? 'done' : (hosting.project ? 'now' : 'later')">
              <span class="n" aria-hidden="true" x-text="domainState === 'live' ? '✓' : '3'"></span>
              <div class="body">
                <h2>Domain</h2>

                <template x-if="domainState === 'none'">
                  <div>
                    <p>Optional. Use a domain bought anywhere, like Hostinger or Porkbun.</p>
                    <div class="row">
                      <input type="text" class="mono" style="width:240px" x-model="hostingForm.domain" placeholder="yourname.com" aria-label="Domain" :disabled="!hosting.project" @keydown.enter="hostingAction('domain')">
                      <button class="btn sm" type="button" @click="hostingAction('domain')" :disabled="!hosting.project || !!hostingForm.busy || !hostingForm.domain.trim()">Use domain</button>
                      <button class="btn sm ghost" type="button" x-show="hostingForm.changing" @click="hostingForm.changing = false; hostingForm.domain = hosting.domain">Cancel</button>
                    </div>
                  </div>
                </template>

                <template x-if="domainState === 'add'">
                  <div>
                    <p x-text="`Add ${hosting.domain} to your Cloudflare account. This is the one step the CMS can’t do for you.`"></p>
                    <ol class="howto">
                      <li>Open Cloudflare and click <b>Add a domain</b>.</li>
                      <li x-text="`Type ${hosting.domain} and pick the Free plan.`"></li>
                      <li>Continue past the DNS records screen. Nothing there needs changing.</li>
                    </ol>
                    <div class="row"><a class="btn sm pri" href="https://dash.cloudflare.com/" target="_blank" rel="noopener">Open Cloudflare ↗</a><span class="wait">Checking every few seconds</span></div>
                  </div>
                </template>

                <template x-if="domainState === 'nameservers'">
                  <div>
                    <p x-text="`Where you bought ${hosting.domain}, replace its nameservers with these two:`"></p>
                    <div class="ns">
                      <template x-for="ns in hosting.zone.nameServers" :key="ns">
                        <div><code x-text="ns"></code><button class="btn sm" type="button" @click="copy(ns)">Copy</button></div>
                      </template>
                    </div>
                    <dl class="where">
                      <dt>Hostinger</dt><dd>Domains, then DNS / Nameservers, then Change nameservers</dd>
                      <dt>Porkbun</dt><dd>Domain management, then Details, then Authoritative nameservers</dd>
                    </dl>
                    <p class="muted" x-show="hosting.zone.originalNameServers.length" x-text="`Replace: ${hosting.zone.originalNameServers.join(', ')}`"></p>
                    <div class="row"><span class="wait">Waiting for the switch. Usually 15 to 60 minutes, sometimes up to a day.</span></div>
                  </div>
                </template>

                <template x-if="domainState === 'ssl'">
                  <div>
                    <p x-text="`${hosting.domain} is on Cloudflare. Connecting it to your site and setting up the secure certificate.`"></p>
                    <div class="row"><span class="wait" x-text="(hosting.pagesDomains || []).length ? (hosting.pagesDomains || []).map((d) => `${d.name}: ${d.status}`).join(' · ') : 'Starting'"></span></div>
                  </div>
                </template>

                <template x-if="domainState === 'live'">
                  <p><a :href="`https://${hosting.domain}`" target="_blank" rel="noopener" x-text="`https://${hosting.domain} ↗`"></a> <span class="okline">is live</span></p>
                </template>

                <p class="badline" x-show="hosting.domainError && domainState !== 'none'" x-text="hosting.domainError"></p>
                <div class="row" x-show="hosting.domain && domainState !== 'none'">
                  <button class="btn sm" type="button" @click="hostingForm.changing = true; hostingForm.domain = ''">Change domain</button>
                  <button class="linkbtn bad" type="button" @click="confirmBar(`Remove ${hosting.domain} from your site?`, 'The site stays online at its pages.dev address.', 'Remove', () => hostingAction('remove'))">Remove domain</button>
                </div>
              </div>
            </li>
          </ol>
        </template>
        <p class="hint">To move to a new domain later, use Change domain.</p>
      </div>
    </template>

    <!-- ================= HISTORY ================= -->
    <template x-if="view === 'history'">
      <div>
        <div class="ph"><h1>History</h1><span class="sub">Every publish is a version you can go back to.</span></div>
        <div class="hist">
          <template x-for="(h, i) in history" :key="h.hash"><div class="r"><span class="d" x-text="fmtDate(h.date)"></span><span x-text="versionName(h)"></span><span class="now" x-text="i === 0 ? 'Latest' : ''"></span><button class="linkbtn" type="button" x-show="i > 0" @click="revert(h)">Restore</button></div></template>
          <div class="empty" x-show="!history.length"><b>Nothing published yet</b>Each time you publish, a version appears here.</div>
        </div>
        <p class="hint" x-show="history.length">Restore brings a version back as changes you can publish.</p>
      </div>
    </template>

    <!-- ================= SETUP ================= -->
    <template x-if="view === 'setup' && setupState">
      <div class="setup">
        <div>
          <h1>Set up the CMS</h1>
          <p class="lead">This only happens once. Each step checks itself.</p>
          <div class="stp" :class="setupState.folder.ok ? 'done' : 'bad'"><span class="n" x-text="setupState.folder.ok ? '✓' : '1'"></span><span><b>Portfolio folder</b><span class="s mono" x-text="setupState.folder.path"></span></span></div>
          <div class="stp" :class="setupState.git.ok ? 'done' : 'bad'"><span class="n" x-text="setupState.git.ok ? '✓' : '2'"></span><span><b>Git</b>
            <span class="s" x-text="setupState.git.ok ? `Git ${setupState.git.version} found` : 'Git is not installed.'"></span>
            <span class="acts" x-show="!setupState.git.ok"><a class="btn sm" href="https://git-scm.com/download/win" target="_blank" rel="noopener">Get Git for Windows ↗</a><button class="btn sm ghost" type="button" @click="loadSetup()">Check again</button></span></span></div>
          <div class="stp" :class="setupState.repo.hasHead ? 'done' : ''"><span class="n" x-text="setupState.repo.hasHead ? '✓' : '3'"></span><span><b>First version</b>
            <span class="s" x-text="setupState.repo.hasHead ? 'History started' : 'Saves the current content as the first version in history.'"></span>
            <span class="acts" x-show="!setupState.repo.hasHead"><button class="btn sm" type="button" @click="setupAction('init')" :disabled="setupForm.busy" x-text="setupForm.busy === 'init' ? 'Saving…' : 'Save first version'"></button></span></span></div>
          <div class="stp" :class="setupState.github.ok ? 'done' : (setupState.github.url ? 'bad' : '')"><span class="n" x-text="setupState.github.ok ? '✓' : '4'"></span><span><b>GitHub backup</b>
            <span class="s" x-show="setupState.github.ok" x-text="`Connected to ${setupState.github.url}`"></span>
            <span class="s" x-show="!setupState.github.ok && setupState.github.url" x-text="`Can't reach ${setupState.github.url}. ${setupState.github.message}`"></span>
            <span class="s" x-show="!setupState.github.url">GitHub keeps a backup of every version. You can skip this and set it up later in Settings.</span>
            <template x-if="!setupState.github.ok">
              <span>
                <span class="acts" x-show="setupState.github.ghAvailable"><input type="text" x-model="setupForm.repoName" aria-label="Backup name on GitHub" style="width:180px"><select x-model="setupForm.visibility" style="width:110px" aria-label="Visibility"><option value="private">Private</option><option value="public">Public</option></select><button class="btn sm" type="button" @click="setupAction('gh')" :disabled="setupForm.busy" x-text="setupForm.busy === 'gh' ? 'Creating…' : 'Create on GitHub'"></button></span>
                <span class="acts"><input type="url" class="mono" x-model="setupForm.remote" placeholder="https://github.com/you/portfolio.git" aria-label="Existing GitHub address"><button class="btn sm" type="button" @click="setupAction('remote')" :disabled="setupForm.busy || !setupForm.remote">Use existing</button></span>
              </span>
            </template></span></div>
          <div class="stp" :class="setupState.preview.ok ? 'done' : ''"><span class="n" x-text="setupState.preview.ok ? '✓' : '5'"></span><span><b>Preview</b>
            <span class="s" x-text="setupState.preview.ok ? `Running on ${setupState.preview.url}` : 'Starting…'"></span>
            <span class="acts" x-show="!setupState.preview.ok"><button class="btn sm ghost" type="button" @click="setupAction('preview')">Check again</button></span></span></div>
          <div class="stp" :class="setupState.shortcut.ok ? 'done' : ''"><span class="n" x-text="setupState.shortcut.ok ? '✓' : '6'"></span><span><b>Desktop shortcut</b>
            <span class="s" x-show="setupState.shortcut.ok">"Portfolio CMS" is on your desktop</span>
            <label class="chk" x-show="!setupState.shortcut.ok" style="margin-top:6px;display:flex"><input type="checkbox" x-model="setupForm.shortcut">Add "Portfolio CMS" to the desktop</label></span></div>
          <p class="badline" x-show="setupForm.error" x-text="setupForm.error" style="margin-top:14px"></p>
          <div class="fin"><button class="btn pri" type="button" @click="finishSetup()" :disabled="setupForm.busy || !setupState.git.ok" x-text="setupForm.busy === 'finish' ? 'Finishing…' : 'Open CMS'"></button><span x-text="setupState.github.ok ? '' : 'You can set up GitHub backup later in Settings.'"></span></div>
        </div>
        <div class="aside">
          <h2>Good to know</h2>
          <dl>
            <div><dt>Where content lives</dt><dd>Plain files in this folder. Each publish saves a version and backs it up to GitHub.</dd></div>
            <div><dt>GitHub sign-in</dt><dd>Handled by Git's own login window. The CMS never sees your password.</dd></div>
            <div><dt>Going live</dt><dd>After setup, open <b>Hosting</b> in the sidebar to connect Cloudflare and your domain.</dd></div>
          </dl>
          <h2>What's in the folder</h2>
<pre>content/      your text and settings
site/public/  photos, screenshots, résumé
site/         the Astro site
cms/          this app</pre>
        </div>
      </div>
    </template>
  </main>

  <!-- preview -->
  <section class="pv" x-show="view !== 'setup'" aria-label="Preview">
    <div class="pvh">
      <template x-if="view !== 'settings'">
        <span class="seg"><button type="button" :class="{ on: previewMode === 'desktop' }" @click="previewMode = 'desktop'">Desktop</button><button type="button" :class="{ on: previewMode === 'phone' }" @click="previewMode = 'phone'">Phone</button></span>
      </template>
      <span x-show="view === 'settings'">How the site appears when shared</span>
      <span class="u" x-show="view !== 'settings'" x-text="preview.url ? preview.url.replace('http://', '') + previewPath : ''"></span>
      <a class="o" x-show="preview.url && view !== 'settings'" :href="preview.url + previewPath" target="_blank" rel="noopener">Open in browser ↗</a>
    </div>
    <div class="pvb" :class="{ phone: previewMode === 'phone', share: view === 'settings' }" x-ref="pvb">
      <template x-if="view === 'settings' && form">
        <div style="display:contents">
          <div><div class="lb">Google</div><div class="serp"><div class="u" x-text="(form.settings.siteUrl || '').replace(/^https?:\/\//, '')"></div><div class="t" x-text="form.settings.title"></div><div class="d" x-text="form.settings.description"></div></div></div>
          <div><div class="lb">LinkedIn, WhatsApp, Discord</div><div class="lcard"><img :src="`/site/og.png?t=${nonce}`" alt="" onerror="this.style.visibility='hidden'" onload="this.style.visibility='visible'"><div class="m"><span x-text="form.settings.title"></span><div x-text="(form.settings.siteUrl || '').replace(/^https?:\/\//, '')"></div></div></div></div>
        </div>
      </template>
      <template x-if="view !== 'settings' && preview.status === 'running'">
        <iframe :src="previewSrc" :style="frameStyle" title="Site preview" x-ref="frame" @load="framed()"></iframe>
      </template>
      <template x-if="view !== 'settings' && preview.status === 'starting'">
        <div class="pvdead"><b>Starting the preview…</b>This takes a few seconds.</div>
      </template>
      <template x-if="view !== 'settings' && preview.status === 'stopped'">
        <div class="pvdead"><b>The preview stopped</b>Your content is safe.<code x-text="preview.log.slice(-6).join('\n') || 'No output.'"></code><button class="btn sm" type="button" @click="restartPreview()">Restart preview</button></div>
      </template>
    </div>
  </section>

  <!-- publish panel -->
  <template x-if="panel">
    <aside class="pubp" aria-label="Publish" @click.outside="if (!$event.target.closest('.bb') && !$event.target.closest('.cb')) panel = false">
      <div class="ph">
        <div><h2 x-text="changes.items.length ? `Publish ${changes.items.length} change${changes.items.length === 1 ? '' : 's'}` : 'Nothing to publish'"></h2><span class="sub" x-text="changes.items.length ? 'None of this is online yet.' : 'Your site is up to date.'"></span></div>
        <button class="x" type="button" @click="panel = false" aria-label="Close">✕</button>
      </div>
      <div class="chg" x-show="changes.items.length">
        <template x-for="item in changes.items" :key="item.key">
          <div class="c">
            <span><b x-text="item.label"></b><span class="w" x-text="item.state === 'new' ? 'Added' : item.state === 'deleted' ? 'Deleted' : (item.summary && item.summary !== 'changed' ? item.summary.charAt(0).toUpperCase() + item.summary.slice(1) : 'Edited')"></span></span>
            <button class="linkbtn" type="button" @click="discardOne(item)" x-show="changes.hasHead">Undo</button>
          </div>
        </template>
      </div>
      <template x-if="changes.items.length">
        <div class="pchk">
          <div x-show="busy === 'checking'"><span class="spin"></span>Checking your site…</div>
          <template x-if="busy !== 'checking' && lastCheck">
            <div style="display:contents">
              <div :class="lastCheck.ok ? 'ok' : 'bad'"><span x-text="lastCheck.ok ? '✓' : '✕'"></span><span x-text="lastCheck.ok ? 'Every page builds' : `A page didn't build: ${lastCheck.message}`"></span></div>
              <template x-for="w in lastCheck.warnings || []" :key="w"><div class="warn"><span>!</span><span x-text="w"></span></div></template>
              <template x-for="l in lastCheck.links?.broken || []" :key="'b' + l.url"><div class="bad"><span>✕</span><span x-text="`Broken link in ${l.where.join(', ')}: ${l.url}`"></span></div></template>
              <template x-if="lastCheck.links?.unknown?.length"><div class="warn"><span>!</span><span x-text="`${lastCheck.links.unknown.map((l) => hostOf(l.url)).join(', ')} block link checks. Open them yourself to be sure.`"></span></div></template>
              <div class="muted" x-show="lastCheck.links?.offline"><span>·</span><span>Links weren't checked because you're offline.</span></div>
            </div>
          </template>
        </div>
      </template>
      <div class="f" x-show="changes.items.length"><label for="cm">What changed? <i class="opt">Optional</i></label><input id="cm" type="text" x-model="commitMessage" maxlength="120" :placeholder="defaultMessage()"></div>
      <div class="go">
        <button class="btn pri" type="button" @click="publish(commitMessage)" :disabled="(!changes.items.length && !changes.ahead && !changes.undeployed) || !!busy" x-text="busy === 'publishing' ? 'Publishing…' : 'Publish'"></button>
        <span class="pnote" x-text="changes.hosted ? 'Live in a few seconds. A copy goes to your GitHub backup.' : (data.remote ? 'Goes to your GitHub backup.' : 'Saved as a version on this computer.')"></span>
      </div>
    </aside>
  </template>

  <!-- bottom bar -->
  <footer class="bb" x-show="view !== 'setup'">
    <span class="n" :class="barView.tone" x-text="barView.text"></span>
    <span class="w" x-text="barView.sub" :title="barView.sub"></span>
    <div class="r">
      <template x-for="a in (barView.actions || []).filter((a) => a.show !== false)" :key="a.label">
        <span style="display:contents">
          <template x-if="a.href"><a class="btn" :class="a.kind" :href="a.href" target="_blank" rel="noopener" x-text="a.label"></a></template>
          <template x-if="!a.href"><button class="btn" type="button" :class="a.kind" @click="a.fn()" :disabled="!!busy" x-text="a.label"></button></template>
        </span>
      </template>
    </div>
  </footer>
</div>

<!-- maintenance dialog -->
<template x-if="modal && maintForm">
  <div class="ov" @click.self="modal = null">
    <div class="mdl" role="dialog" aria-modal="true" :aria-label="{ 'maint-on': 'Turn on maintenance', 'maint-off': 'Turn off maintenance', 'maint-edit': 'Maintenance message' }[modal]" x-init="$nextTick(() => $el.querySelector('.act .btn:last-child').focus())">
      <template x-if="modal === 'maint-off'">
        <div><h2>Turn off maintenance?</h2><p x-text="`Your full portfolio will be back on ${(data.settings?.siteUrl || '').replace(/^https?:\/\//, '') || 'your site'} in about a minute.`"></p></div>
      </template>
      <template x-if="modal !== 'maint-off'">
        <div>
          <h2 x-text="modal === 'maint-on' ? 'Turn on maintenance?' : 'Maintenance message'"></h2>
          <p x-text="modal === 'maint-on' ? 'Visitors see this short page instead of your portfolio, about a minute after you confirm. Your content stays as it is.' : 'What visitors see while maintenance is on.'"></p>
          <div class="f" :class="{ err: err('status.message') }" style="margin-top:12px"><label for="mt-msg">Message <i :class="{ over: count(maintForm.message, 200).over }" x-text="count(maintForm.message, 200).text"></i></label><textarea id="mt-msg" x-model="maintForm.message" rows="2"></textarea><span class="errt" x-text="err('status.message')"></span></div>
          <div class="mopts">
            <label class="chk"><input type="checkbox" x-model="maintForm.showPhoto">Photo</label>
            <label class="chk"><input type="checkbox" x-model="maintForm.showEmail">Email</label>
            <label class="chk"><input type="checkbox" x-model="maintForm.showResume">Résumé link</label>
            <label class="chk"><input type="checkbox" x-model="maintForm.showLinks">Links</label>
          </div>
        </div>
      </template>
      <div class="act"><button class="btn ghost" type="button" @click="modal = null">Cancel</button><button class="btn dark" type="button" @click="confirmMaint()" x-text="{ 'maint-on': 'Turn on', 'maint-off': 'Turn off', 'maint-edit': 'Save message' }[modal]"></button></div>
    </div>
  </div>
</template>

<div class="toast" x-show="toast" x-text="toast" x-transition.opacity role="status" x-cloak></div>
</body>
</html>
